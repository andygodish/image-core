name: CI Build

on:
  push:
    # Triggers on every push to any branch
    branches:
      - '**'

# Automatically cancels older in-progress runs on the same branch if you push new commits rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Execute Make Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # If your Makefile requires Docker/Buildx for multi-platform features, set it up here:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Build
        run: make build