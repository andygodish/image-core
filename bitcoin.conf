# ==============================================================================
# Network & RPC Server Options
# ==============================================================================

# Enable the HTTP RPC server (required for electrs & local CLI access)
server=1

# Listen on all interfaces inside the container so Docker network aliases can resolve
rpcbind=0.0.0.0:8332
rpcallowip=0.0.0.0/0

# P2P Networking
listen=1
bind=0.0.0.0:8333

# Cap maximum peer connections to prevent memory/bandwidth spikes
maxconnections=16

# ==============================================================================
# Blockchain & Indexing Options
# ==============================================================================
# Build a full transaction index (txindex) — MANDATORY for electrs / address indexing
txindex=1

# Disable block pruning — MANDATORY for full node indexing & electrs
prune=0

# ==============================================================================
# Performance & Resources
# ==============================================================================
# Allocate 2GB for database caching during sync (Core auto-scales if RAM allows)
dbcache=2048

# Reduce disk write frequency for raw block data
coinstatsindex=0

# Stream all output to stdout for Docker log drivers
printtoconsole=1